const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const n2=x=>Math.round((+x||0)*100)/100;

const nextMonth=ym=>{let y=+ym.slice(0,4),m=+ym.slice(5,7);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};

const LS='schoolacc.v1';
let dbh=null, saveT=null, lastChunks=[], syncState='محلي', persistErr=false;
function touch(){VER++;D.ts=Date.now();clearTimeout(saveT);saveT=setTimeout(persist,1200);setSync('جارٍ الحفظ…');}
function setSync(t){syncState=t;const e=$('#sync');if(e)e.textContent=t}
async function gz(str){
  if(typeof CompressionStream==='undefined')return {enc:'raw',s:str};
  const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=8192)b+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
  return {enc:'gz',s:btoa(b)};
}
async function ungz(enc,s){
  if(enc==='raw')return s;
  const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(u);w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
async function persist(){
  const json=JSON.stringify(D);
  try{localStorage.setItem(LS,json)}catch(e){persistErr=true}
  if(!dbh){setSync(persistErr?'تعذر الحفظ المحلي':'محفوظ محليًا');return}
  try{
    const g=await gz(json);const CH=180000,chunks=[];
    for(let i=0;i<g.s.length;i+=CH)chunks.push(g.s.slice(i,i+CH));
    for(let i=0;i<chunks.length;i++){ if(lastChunks[i]!==chunks[i]) await dbh.doc('books/c'+i).set({s:chunks[i]}); }
    await dbh.doc('books/meta').set({n:chunks.length,enc:g.enc,ts:D.ts});
    lastChunks=chunks;setSync('محفوظ في السحابة');
  }catch(e){setSync('محفوظ محليًا (تعذر الحفظ السحابي)')}
}
async function loadAll(){
  let local=null;try{const t=localStorage.getItem(LS);if(t)local=JSON.parse(t)}catch(e){}
  let remote=null;
  try{
    const c=window.claude&&await window.claude.use('db');
    if(c){dbh=c;const m=await c.doc('books/meta').get();
      if(m.exists){const md=m.data();let s='';for(let i=0;i<md.n;i++){const d=await c.doc('books/c'+i).get();s+=d.data().s;lastChunks[i]=d.data().s}
        remote=JSON.parse(await ungz(md.enc,s));}}

  if(pick&&pick.v!==3)pick=null;
  if(pick){D=pick;migrate();}
  return !!pick;
}

function post(date,desc,lines,meta={}){
  lockCheck(date);
  const dB=meta.br||SB()||'';const L=lines.map(l=>({a:l[0],d:n2(l[1]),c:n2(l[2]),cc:l[3]||'',br:l[4]||dB})).filter(l=>l.d||l.c);
  const merged={};L.forEach(l=>{const k=[l.a,l.cc,l.br,l.d?'d':'c'].join('|');if(merged[k]){merged[k].d=n2(merged[k].d+l.d);merged[k].c=n2(merged[k].c+l.c)}else merged[k]={...l}});
  const F=Object.values(merged);
  const td=n2(sum(F,l=>l.d)),tc=n2(sum(F,l=>l.c));
  if(!F.length)return null;
  if(Math.abs(td-tc)>0.009)throw new UErr('القيد غير متوازن: مدين '+fmt(td)+' ودائن '+fmt(tc));
  F.forEach(l=>{if(!account(l.a))throw new UErr('حساب غير موجود: '+l.a)});
  const je={id:uid(),no:D.seq.je++,date,desc,lines:F,src:meta.src||'manual',ref:meta.ref||'',user:SESSION?SESSION.name:'النظام',rev:false};
  D.journal.push(je);return je;
}

function bal(code,o={}){
  const a=account(code);if(!a)return 0;
  const rows=LED().filter(l=>(a.grp?(l.a.startsWith(code)&&l.a!==code):l.a===code)&&(!o.from||l.date>=o.from)&&(!o.to||l.date<=o.to)&&(!o.cc||l.cc===o.cc)&&brOK(l,o.br)&&(!o.noClose||l.src!=='close'));
  const d=sum(rows,r=>r.d),c=sum(rows,r=>r.c);

}

function opGenerateFees(yid,filt={}){
  need('fees');const y=D.years.find(x=>x.id===yid);chk(y,'اختر السنة الدراسية');
  chk(y.inst&&y.inst.length,'عرّف جدول الأقساط للسنة أولًا');
  chk(Math.abs(sum(y.inst,i=>i.pct)-100)<0.01,'نسب الأقساط يجب أن يكون مجموعها 100%');
  const stus=D.students.filter(s=>s.status==='active'&&(!filt.grade||s.grade===filt.grade)&&(!SB()||s.br===SB())&&(!filt.br||s.br===filt.br));
  const L=[];let cnt=0,total=0;
  stus.forEach(s=>{
    const dp=discountPct(s),cc=stuCC(s);
    D.feeTypes.filter(f=>!f.sys).forEach(ft=>{
      if(ft.opt&&!(s.opt&&s.opt[ft.id]))return;
      if(D.charges.some(c=>c.sid===s.id&&c.yid===yid&&c.ft===ft.id&&c.status!=='void'))return;
      const gross=feeFor(s.grade,ft.id,yid);if(!gross)return;
      const disc=ft.disc?n2(Math.min(gross,gross*dp.pct/100+dp.amt)):0;
      const sched=ft.inst?y.inst:[{due:y.inst[0].due,pct:100}];
      let rg=gross,rd=disc;
      sched.forEach((p,i)=>{
        const last=i===sched.length-1;
        const g=last?rg:n2(gross*p.pct/100),d=last?rd:n2(disc*p.pct/100);rg=n2(rg-g);rd=n2(rd-d);
        D.charges.push({id:uid(),sid:s.id,yid,ft:ft.id,desc:sched.length>1?'القسط '+(i+1)+' من '+sched.length:'',gross:g,disc:d,amt:n2(g-d),due:p.due,status:'active'});
        L.push(['1210',g-d,0,cc,s.br],['4900',d,0,cc,s.br],[ft.acc,0,g,cc,s.br]);total+=g-d;
      });cnt++;
    });
  });
  if(!cnt)return {cnt:0,total:0};
  post(filt.date||todayISO(),'استحقاق رسوم السنة '+y.name,L,{src:'fees'});
  audit('توليد الرسوم',y.name+' - '+cnt+' بند');touch();return {cnt,total:n2(total)};
}

function payCalc(month,br){
  const end=lastDayOf(month),st=month+'-01';
  return D.employees.filter(e=>e.status==='active'&&(!e.hire||e.hire<=end)&&(!br||e.br===br)).map(e=>{
    const p=(D.pin[month]||{})[e.id]||{};
    const lv=sum(D.leaves.filter(l=>l.emp===e.id&&l.type==='unpaid'&&l.from>=st&&l.from<=end),l=>l.days);
    const unpaid=lv+(+p.absent||0),base=+e.salary||0,allow=+e.allow||0,hours=+p.hours||0,hp=n2(hours*(+e.rate||0)),bonus=+p.bonus||0;
    const ded=n2((base+allow)/30*unpaid),gross=n2(base+allow+hp+bonus-ded);
    const ss=e.noss?0:n2(base*D.set.ssEmp/100),er=e.noss?0:n2(base*D.set.ssEr/100);
    const tax=n2(Math.max(0,gross-ss-D.set.taxEx)*D.set.taxRate/100);
    let loan=0;D.loans.filter(l=>l.emp===e.id&&l.rem>0).forEach(l=>{loan+=Math.min(l.monthly,l.rem)});loan=n2(loan);
    return {emp:e.id,name:e.name,job:e.job,cc:e.cc||'a',br:e.br||'',base,allow,hours,hp,bonus,unpaid,ded,gross,ss,er,tax,loan,net:n2(gross-ss-tax-loan)};
  });
}

function opCloseYear(yid){
  if(!isAdmin())throw new UErr('الإقفال من صلاحية الحساب الرئيسي فقط');
  const y=D.years.find(x=>x.id===yid);chk(y&&!y.closed,'السنة مقفلة');
  const keep=SESSION;SESSION={...SESSION,br:''};
  try{
  const types={};D.accounts.forEach(a=>{if(!a.grp&&(a.type==='revenue'||a.type==='expense'))types[a.code]=1});
  const m={},netBr={};
  D.journal.forEach(j=>{if(j.src==='close'||j.date<y.start||j.date>y.end)return;j.lines.forEach(l=>{if(!types[l.a])return;const k=l.a+'|'+l.br+'|'+l.cc;m[k]=n2((m[k]||0)+l.d-l.c);})});
  const L=[];let net=0;
  Object.entries(m).forEach(([k,raw])=>{if(!raw)return;const [a,br,cc]=k.split('|');if(raw>0)L.push([a,0,raw,cc,br]);else L.push([a,-raw,0,cc,br]);netBr[br]=n2((netBr[br]||0)-raw);net=n2(net-raw)});
  Object.entries(netBr).forEach(([br,n])=>{if(n>0)L.push(['3200',0,n,'',br]);else if(n<0)L.push(['3200',-n,0,'',br])});
  if(L.length)post(y.end,'قيد إقفال السنة '+y.name,L,{src:'close'});
  y.closed=true;D.set.lockedUntil=y.end;audit('إقفال سنة',y.name+' - صافي '+fmt(net));touch();return net;
  }finally{SESSION=keep}
}

function hashPin(p){
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode('school|'+p)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));
  let h=5381;for(const ch of 'school|'+p)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return Promise.resolve(String(h));
}

function fieldHtml(f,v){
  const id='f_'+f.k,val=v??f.v??'',req=f.req?' required':'',ro=f.ro?' readonly':'';
  let c;
  if(f.t==='select')c=`<select id="${id}"${req}${f.ro?' disabled':''}>${opts(typeof f.o==='function'?f.o():f.o,val,f.blank)}</select>`;
  else if(f.t==='textarea')c=`<textarea id="${id}"${req}${ro}>${esc(val)}</textarea>`;
  else if(f.t==='check')return `<label class="f${f.full?' full':''}" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="${id}"${val?' checked':''}><span style="color:var(--ink)">${f.l}</span></label>`;
  else c=`<input id="${id}" type="${f.t==='pass'?'password':f.t||'text'}" value="${esc(val)}"${req}${ro}${f.ph?` placeholder="${esc(f.ph)}"`:''}${f.t==='number'?` step="${f.step||'any'}"${f.min!==undefined?` min="${f.min}"`:''}`:''}${f.t==='tel'?' inputmode="tel"':''}>`;
  return `<label class="f${f.full?' full':''}"><span>${f.l}${f.req?' *':''}</span>${c}${f.hint?`<small class="mut">${f.hint}</small>`:''}</label>`;
}
function readForm(fields){
  const v={};
  for(const f of fields){const e=$('#f_'+f.k);if(!e)continue;
    if(f.t==='check')v[f.k]=e.checked;else if(f.t==='number')v[f.k]=e.value===''?'':+e.value;else v[f.k]=e.value.trim();
    if(f.req&&(v[f.k]===''||v[f.k]===undefined)){e.focus();throw new UErr('الحقل مطلوب: '+f.l.replace(/<[^>]*>/g,''))}}
  return v;
}

function formModal(s){
  const init=s.init||{};
  const html=`<h2>${s.title}</h2><form id="mf" novalidate>${s.pre||''}<div class="fg">${s.fields.map(f=>fieldHtml(f,init[f.k])).join('')}</div>${s.extra||''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-act="close">إلغاء</button><button class="btn pri" type="submit">${s.submit||'حفظ'}</button></div></form>`;
  modal(html,s.wide);
  if(s.onOpen)s.onOpen();
  $('#mf').addEventListener('submit',e=>{e.preventDefault();
    try{if(s.perm)need(s.perm);const v=readForm(s.fields);const keep=s.ok(v);if(keep!==false)closeModal();render()}catch(x){fail(x)}});
}

function ledRow(id,r){

function tbl(cols,rows,o={}){
  if(!rows.length)return `<div class="tw"><div class="empty">${o.empty||'لا توجد بيانات'}</div></div>`;
  const lim=o.limit||400,shown=rows.slice(0,lim);
  const th=cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('');
  const dt=h=>String(h).replace(/(^|>)([^<]*)/g,(m,a,t)=>a+t.replace(/\d{4}-\d{2}-\d{2}/g,'<bdi class="dt">$&</bdi>'));
  const body=shown.map((r,i)=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}${c.a?' acts':''}">${dt(c.f(r,i))}</td>`).join('')}</tr>`).join('');
  const foot=o.foot?`<tfoot><tr>${o.foot.map((x,i)=>`<td class="${cols[i]&&cols[i].n?'n':''}">${x??''}</td>`).join('')}</tr></tfoot>`:'';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot}</table></div>${rows.length>lim?`<div class="mut" style="padding:6px">يظهر أول ${lim} من ${rows.length} سجل. استخدم البحث لتضييق النتائج.</div>`:''}`;
}

async function saveFile(name,data){
  let d=null;try{d=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data});toast('تم تجهيز الملف: '+name);return}catch(e){if(e&&e.code==='declined')return}}
  modal(`<h2>نسخ المحتوى</h2><p class="mut" style="margin:0">لا يدعم هذا العرض تنزيل الملفات مباشرة. انسخ المحتوى والصقه في ملف باسم <b>${esc(name)}</b>.</p><textarea id="cpy" style="min-height:260px;direction:ltr" readonly>${esc(data)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">إغلاق</button><button class="btn pri" id="cpyb">نسخ</button></div>`,1);
  $('#cpyb').onclick=async()=>{try{await navigator.clipboard.writeText(data);toast('تم النسخ')}catch(e){$('#cpy').select();toast('حدد النص وانسخه يدويًا')}};
}

/* مخططات SVG بسيطة بمقياس واحد */
function barChart(labels,series,o={}){
  const W=640,H=o.h||220,pl=54,pr=8,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...series.flatMap(s=>s.v));const nice=(m=>{const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p})(max);
  const gw=iw/labels.length,bw=Math.min(34,gw/(series.length+0.8)),short=v=>v>=1e9?(v/1e9)+'B':v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(0)+'K':v;
  let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${short(nice*i/4)}</text>`}
  labels.forEach((l,i)=>{const cx=pl+gw*(i+.5);
    series.forEach((s,j)=>{const h=ih*s.v[i]/nice,x=cx-bw*series.length/2+bw*j+1;g+=`<rect x="${x}" y="${pt+ih-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="2" style="fill:${s.c}"><title>${esc(s.n)} - ${esc(l)}: ${fmt(s.v[i])}</title></rect>`});
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'مخطط')}" direction="ltr">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;
}

function ledgerOf(code,from,to,br){
  const a=account(code),nd=a.grp?(a.type==='asset'||a.type==='expense'):natDebit(a);
  const rows=LED().filter(l=>(a.grp?l.a.startsWith(code)&&l.a!==code:l.a===code)&&brOK(l,br));
  const before=rows.filter(l=>from&&l.date<from),inr=rows.filter(l=>inRange(l.date,from,to));
  const sgn=x=>nd?x:-x;let open=n2(sgn(sum(before,l=>l.d)-sum(before,l=>l.c))),run=open;
  const out=inr.map(l=>{run=n2(run+sgn(l.d-l.c));return {...l,b:run}});
  return {open,rows:out,close:run,d:n2(sum(inr,l=>l.d)),c:n2(sum(inr,l=>l.c))};
}

function tbData(from,to,br){
  const rows=[];D.accounts.filter(a=>!a.grp).forEach(a=>{
    const all=LED().filter(l=>l.a===a.code&&(!to||l.date<=to)&&brOK(l,br)),inr=all.filter(l=>!from||l.date>=from);
    const bef=all.filter(l=>from&&l.date<from);const open=sum(bef,l=>l.d)-sum(bef,l=>l.c);
    const d=n2(sum(inr,l=>l.d)),c=n2(sum(inr,l=>l.c)),net=n2(open+d-c);
    if(!d&&!c&&!net)return;rows.push({a,d,c,bd:net>0?net:0,bc:net<0?-net:0});
  });
  return {rows,d:n2(sum(rows,r=>r.d)),c:n2(sum(rows,r=>r.c)),bd:n2(sum(rows,r=>r.bd)),bc:n2(sum(rows,r=>r.bc))};
}

  const addDays_=(d,m)=>{const x=new Date(d+'T00:00:00Z');return x};
  try{
  OLD_DATA.forEach(([no,name,cs])=>{
    const nw=cs.filter(c=>c[0]>='2026-08-01'),od=cs.filter(c=>c[0]<'2026-08-01');
    const paidNew=sum(nw,c=>c[5]),remOld=sum(od,c=>c[6]);
    const g=nw.length?'A':remOld>0?'B':'C';
    const s={id:uid(),code:'S-'+String(no).padStart(4,'0'),name,gender:'m',grade:'g0',sec:'',br,gname:'',gphone:'',status:g==='A'?'active':'hold',opt:{},joined:'2026-09-01',old:g};
    D.students.push(s);cnt[g]++;D.seq.st=Math.max(D.seq.st,no+1);
    // رصيد السنة السابقة
    if(remOld<0){const a=-remOld;const je=post(TIDY,'رصيد دائن من 2025-2026 للطالب '+s.name,[['3900',a,0,'',''],['1210',0,a,'a',br]],{src:'open',br});
      D.receipts.push({id:uid(),no:'رصيد-'+no,date:TIDY,sid:s.id,yid:'y2526',amt:a,camt:a,cur:'IQD',rate:1,method:'رصيد دائن سابق',tid:'',ref:'',note:'رصيد دائن من السنة السابقة',status:'valid',user:'استيراد',jids:[je.id]})}
    if(remOld>0){D.charges.push({id:uid(),sid:s.id,yid:'y2526',ft:'open',desc:'رصيد 2025-2026 المتبقي',gross:remOld,disc:0,amt:remOld,due:TIDY,status:'active'});
      post(TIDY,'رصيد 2025-2026 للطالب '+s.name,[['1210',remOld,0,'a',br],['3900',0,remOld,'','',]],{src:'open',br});nCh++}
    // عقود السنة الجديدة
    nw.forEach(c=>{const [date,typ,day,ins,debt,paid]=c;if(!debt)return;
      const rows=[];
      if(typ==='cash'||!ins)rows.push({due:date,amt:debt});
      else{const n=Math.ceil(debt/ins);let left=debt;const d0=new Date(date+'T00:00:00Z');const dd=typ==='sched'&&day?Math.min(day,28):Math.min(d0.getUTCDate(),28);
        for(let i=0;i<n;i++){const a=i===n-1?left:ins;left-=a;const t=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+i,dd));rows.push({due:i===0&&date>t.toISOString().slice(0,10)?date:t.toISOString().slice(0,10),amt:a})}}
      rows.forEach((r,i)=>{D.charges.push({id:uid(),sid:s.id,yid:'y2627',ft:'tuition',desc:rows.length>1?'القسط '+(i+1)+' من '+rows.length:'',gross:r.amt,disc:0,amt:r.amt,due:r.due,status:'active'});nCh++});
      post(date,'عقد '+c[7]+' - '+s.name,[['1210',debt,0,'a',br],['4110',0,debt,'a',br]],{src:'fees',br});
    });
    nw.forEach(c=>{if(c[5]>0){opReceipt({sid:s.id,date:c[0],camt:c[5],cur:'IQD',tid:TC,method:'cash',note:'مبلغ مدفوع قبل الاستيراد'});nRc++}});
  });
  }finally{SESSION=sess}
  audit('استيراد من البرنامج القديم',OLD_DATA.length+' عميل - '+brName(br));touch();return {cnt,nCh,nRc};
}
